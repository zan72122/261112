<!doctype html>
<html lang="ja">
<head>

<meta name="apple-mobile-web-app-capable" content="yes">
<title>てをひろげて、そら！</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe9f1; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#veil { position: fixed; inset: 0; background: #eef3f6; opacity: 1; pointer-events: none; }
/* 読み込みのあいだ：朝の空に紙飛行機がゆっくり浮かぶ（文字なし） */
#load { position: fixed; inset: 0; pointer-events: none; transition: opacity 0.8s ease; background: linear-gradient(#cfe2f1, #eef3f6 62%, #f4f1e6); }
#load svg { position: absolute; left: 50%; top: 46%; width: min(22vw, 22vh); margin: calc(min(22vw, 22vh) / -2); animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 14px 10px rgba(60, 80, 100, 0.18)); }
@keyframes bob { 0%, 100% { transform: translate(-6%, 4%) rotate(-7deg); } 50% { transform: translate(6%, -5%) rotate(-2deg); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="veil"></div>
<div id="load"><svg viewBox="0 0 100 70" aria-hidden="true"><path d="M2 30 98 4 46 44z" fill="#fdfdfb"/><path d="M98 4 46 44 44 64z" fill="#dfe3e6"/><path d="M98 4 44 64 34 40z" fill="#f1f3f4"/><path d="M2 30 34 40 98 4z" fill="#ffffff"/></svg></div>

</html>
