  html, body { margin: 0; height: 100%; background: #9fd0e6; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; outline: none; }
  /* wordless loading sign: a small sun breathing over the sea colour */
  #sun { position: fixed; left: 50%; top: 42%; width: 64px; height: 64px; margin: -32px; border-radius: 50%; background: #fff6d8; box-shadow: 0 0 60px 30px rgba(255, 246, 216, .55); animation: b 1.6s ease-in-out infinite; transition: opacity .8s; pointer-events: none; }
  @keyframes b { 50% { transform: scale(1.18); } }
</style>
