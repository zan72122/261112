<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>プレゼント仕分け工場</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d9f1ff;position:fixed;top:0;left:0;right:0;bottom:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#c{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
.nav{position:absolute;top:50%;width:76px;height:76px;margin-top:-38px;border-radius:50%;background:rgba(255,255,255,.6);
  box-shadow:0 4px 0 rgba(120,140,170,.35);touch-action:none;animation:bob 2.4s ease-in-out infinite}
.nav:before{content:"";position:absolute;top:50%;left:50%;border:17px solid transparent;margin-top:-17px}
#navL{left:max(12px,env(safe-area-inset-left))}
#navL:before{border-right:24px solid #ff8fb4;border-left:0;margin-left:-14px}
#navR{right:max(12px,env(safe-area-inset-right))}
#navR:before{border-left:24px solid #ff8fb4;border-right:0;margin-left:-10px}
.nav.glow{background:#fff3a6;animation:glow .7s ease-in-out infinite}
@keyframes bob{50%{transform:scale(1.07)}}
@keyframes glow{50%{transform:scale(1.28);box-shadow:0 0 0 14px rgba(255,220,80,.45)}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="navL" class="nav"></div>
<div id="navR" class="nav"></div>
<script>window.__t0=performance.now();</script>
<script src="vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/chars.js"></script>
<script src="js/zone0.js"></script>
<script>GF.init();</script>
</body>
</html>
